name: Build & Deploy to EC2

on:
  push:
    branches: [master]

env:
  IMAGE_NAME: hariharan2604/postinvest-pro

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t $IMAGE_NAME:latest .

    - name: Push image to Docker Hub
      run: docker push $IMAGE_NAME:latest

    - name: Set up SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
        chmod 600 ec2-key.pem

    - name: Copy .env to EC2
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        scp -i ec2-key.pem -o StrictHostKeyChecking=no .env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/.env
        scp -i ec2-key.pem -o StrictHostKeyChecking=no compose.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/compose.yaml

    - name: Deploy on EC2
      run: |
        ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd /home/${{ secrets.EC2_USER }}/app
          docker pull hariharan2604/postinvest-pro:latest
          docker compose down
          docker compose up -d
        EOF

    - name: Cleanup SSH key
      run: rm -f ec2-key.pem
