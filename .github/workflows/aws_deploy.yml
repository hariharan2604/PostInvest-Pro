name: Reload on Push to Master

on:
  push:
    branches:
      - master

jobs:
  reload:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository using PAT for authentication
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.PAT_TOKEN }}

    # Deploy to Server (reload app)
    - name: Reload Application
      env:
        HOST: ${{ secrets.SERVER_HOST }}
        USER: ${{ secrets.SERVER_USER }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

        # Test SSH connection
        if ! ssh -i ~/.ssh/id_rsa $USER@$HOST "exit"; then
          echo "SSH connection failed"
          exit 1
        fi

        ssh -i ~/.ssh/id_rsa $USER@$HOST << EOF
          cd /var/www/PostInvest-Pro
          
          # Source nvm to ensure node, npm, and pm2 are available
          export NVM_DIR="\$HOME/.nvm"
          [ -s "\$NVM_DIR/nvm.sh" ] && \. "\$NVM_DIR/nvm.sh"  # This loads nvm
          nvm use v22.13.1  # Ensure the correct Node.js version is used

          # Ensure node, npm, and pm2 are available
          if ! command -v node &> /dev/null; then
            echo "Node.js could not be found, installing..."
            sudo apt update
            sudo apt install -y nodejs npm
          fi

          if ! command -v pm2 &> /dev/null; then
            echo "pm2 could not be found, installing..."
            sudo npm install -g pm2
          fi

          # Pull the latest changes
          git pull https://${USER}:${{ secrets.PAT_TOKEN }}@github.com/hariharan2604/PostInvest-Pro.git
          pwd
          node --version
          npm install

          # Rename .env.production to .env
          if [ -f .env.production ]; then
            mv .env.production .env
          else
            echo ".env.production not found, skipping rename."
          fi

          # Reload the application with pm2
          pm2 reload all
          sudo service nginx restart
        EOF
