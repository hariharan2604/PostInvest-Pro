version: "3.8"

services:
  server:
    image: hariharan2604/postinvest-pro:latest
    env_file: ".env"
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
